name: iOS CI
on:
  pull_request:
    paths: ['ios/**', '.github/workflows/ios-ci.yml']
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios-ci.yml']

jobs:
  validate:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select stable Xcode 26 and print versions
        shell: bash
        run: |
          set -euo pipefail
          XCODE=$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' ! -iname '*beta*' | sort -V | tail -1)
          test -n "$XCODE"
          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
          "$XCODE/Contents/Developer/usr/bin/xcodebuild" -version
          "$XCODE/Contents/Developer/usr/bin/xcodebuild" -showsdks
      - name: Lint property lists
        run: plutil -lint ios/HookshotHero/Resources/Info.plist ios/HookshotHero/Resources/PrivacyInfo.xcprivacy
      - name: Discover simulator
        shell: bash
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | ruby -rjson -e 'd=JSON.parse(STDIN.read)["devices"].values.flatten.find{|x| x["name"].start_with?("iPhone")}; abort "No iPhone simulator" unless d; puts d["udid"]')
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          xcodebuild -project ios/HookshotHero.xcodeproj -scheme HookshotHero -showdestinations | tee /tmp/show-destinations.log
      - name: Debug build
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project ios/HookshotHero.xcodeproj -scheme HookshotHero -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" -derivedDataPath /tmp/HookshotHero-DerivedData clean build | tee /tmp/debug-build.log
      - name: Unit and UI tests
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project ios/HookshotHero.xcodeproj -scheme HookshotHero -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" -derivedDataPath /tmp/HookshotHero-DerivedData test | tee /tmp/tests.log
      - name: Analyze
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project ios/HookshotHero.xcodeproj -scheme HookshotHero -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" -derivedDataPath /tmp/HookshotHero-DerivedData analyze | tee /tmp/analyze.log
      - name: Release build
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project ios/HookshotHero.xcodeproj -scheme HookshotHero -configuration Release -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/HookshotHero-Release-DerivedData clean build | tee /tmp/release-build.log
      - name: Unsigned device archive
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project ios/HookshotHero.xcodeproj -scheme HookshotHero -configuration Release -destination 'generic/platform=iOS' -archivePath /tmp/HookshotHero.xcarchive -derivedDataPath /tmp/HookshotHero-Archive-DerivedData CODE_SIGNING_ALLOWED=NO archive | tee /tmp/archive.log
      - name: Upload textual validation logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: HookshotHero-validation-logs
          path: /tmp/*.log
          if-no-files-found: ignore
